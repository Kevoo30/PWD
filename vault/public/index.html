<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PWD Vault</title>
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d32d27'/%3E%3Ccircle cx='9' cy='16' r='2.4' fill='white'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='white'/%3E%3Ccircle cx='23' cy='16' r='2.4' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Sign in / create -->
  <main id="auth" class="gate">
    <aside class="gate-side">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="12" width="22" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 12V9a6 6 0 0 1 12 0v3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="19" r="1.8" fill="currentColor"/></svg>
        <span>PWD Vault</span>
      </div>
      <p class="lede">Everything you store is sealed in this browser before it is saved. The server only ever holds the sealed copies.</p>
      <p class="fine">There is no password reset. If the master password is lost, nobody can open the box.</p>
    </aside>

    <section class="gate-main">
      <form id="auth-form" novalidate>
        <h1 id="auth-title">Open your vault</h1>
        <p id="auth-lock-note" class="note" hidden></p>

        <label class="f">Email
          <input id="a-email" type="email" autocomplete="username" required>
        </label>
        <label class="f">Master password
          <input id="a-pass" type="password" autocomplete="current-password" required>
        </label>

        <div id="signup-extra" hidden>
          <div id="a-meter" class="meter" aria-live="polite">
            <div class="meter-bar"><span></span><span></span><span></span><span></span></div>
            <div class="meter-label"></div>
          </div>
          <label class="f">Confirm master password
            <input id="a-pass2" type="password" autocomplete="new-password">
          </label>
          <label class="check"><input id="a-ack" type="checkbox"> I understand the master password can't be recovered.</label>
        </div>

        <p id="auth-error" class="error" role="alert" hidden></p>
        <button id="auth-submit" class="btn primary wide" type="submit">Open vault</button>
        <p class="switch"><span id="auth-switch-text">New here?</span> <button id="auth-switch" class="link" type="button">Create an account</button></p>
      </form>
    </section>
  </main>

  <!-- ============ Vault ============ -->
  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="5" y="12" width="22" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 12V9a6 6 0 0 1 12 0v3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="19" r="1.8" fill="currentColor"/></svg></span>
        <span class="brand-name">PWD Vault</span>
      </div>

      <nav id="nav" class="nav"></nav>

      <div class="sidebar-foot">
        <div class="me" id="me-email" title=""></div>
        <div class="me-actions">
          <button id="btn-lock" class="side-btn" type="button">Lock</button>
          <button id="btn-logout" class="side-btn" type="button">Log out</button>
        </div>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button id="btn-menu" class="icon-btn menu-btn" type="button" aria-label="Open menu"></button>
        <div class="search">
          <span class="search-ico" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="Search your vault" aria-label="Search your vault" autocomplete="off" spellcheck="false">
          <kbd class="kbd" aria-hidden="true">/</kbd>
        </div>
        <button id="btn-add" class="btn btn-primary" type="button">
          <span class="btn-plus" aria-hidden="true">+</span> Add item
        </button>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </div>

    <!-- Item drawer -->
    <aside id="drawer" class="drawer" aria-hidden="true" aria-labelledby="drawer-title" role="dialog">
      <form id="item-form" autocomplete="off" novalidate>
        <header class="drawer-head">
          <h2 id="drawer-title">Add item</h2>
          <button id="drawer-close" class="icon-btn" type="button" aria-label="Close"></button>
        </header>

        <div class="drawer-body">
          <div id="type-seg" class="seg" role="tablist" aria-label="Item type">
            <button type="button" role="tab" data-type="password" aria-selected="true">Password</button>
            <button type="button" role="tab" data-type="note" aria-selected="false">Secure note</button>
          </div>

          <div class="field">
            <label for="f-name">Name</label>
            <input id="f-name" type="text" maxlength="120" required>
          </div>

          <div class="only-password">
            <div class="field">
              <label for="f-url">Website</label>
              <div class="input-action">
                <input id="f-url" type="text" inputmode="url" placeholder="https://example.com" maxlength="500" spellcheck="false">
                <a id="f-url-open" class="icon-btn" target="_blank" rel="noopener noreferrer" aria-label="Open website" hidden></a>
              </div>
            </div>
            <div class="field">
              <label for="f-user">Username</label>
              <div class="input-action">
                <input id="f-user" type="text" maxlength="200" spellcheck="false" autocomplete="off">
                <button id="f-user-copy" class="icon-btn" type="button" aria-label="Copy username"></button>
              </div>
            </div>
            <div class="field">
              <label for="f-pass">Password</label>
              <div class="input-action">
                <input id="f-pass" type="password" maxlength="256" spellcheck="false" autocomplete="new-password">
                <button class="icon-btn pw-toggle" type="button" data-toggle-for="f-pass" aria-label="Show password" aria-pressed="false"></button>
                <button id="f-pass-copy" class="icon-btn" type="button" aria-label="Copy password"></button>
              </div>
              <div id="f-meter" class="meter">
                <div class="meter-bar"><span></span><span></span><span></span><span></span></div>
                <div class="meter-label"></div>
              </div>
              <button id="f-gen-toggle" class="link-btn" type="button" aria-expanded="false">Generate a password</button>
              <div id="f-gen" class="gen-inline" hidden></div>
            </div>
          </div>

          <div class="field">
            <label for="f-notes">Notes</label>
            <textarea id="f-notes" rows="5" maxlength="10000"></textarea>
          </div>

          <div class="field">
            <label for="f-folder">Folder</label>
            <input id="f-folder" type="text" list="folder-list" maxlength="60" placeholder="No folder">
            <datalist id="folder-list"></datalist>
          </div>

          <label class="check">
            <input id="f-fav" type="checkbox">
            <span>Add to favorites</span>
          </label>

          <p id="item-error" class="form-error" role="alert" hidden></p>
        </div>

        <footer class="drawer-foot">
          <button id="btn-delete" class="btn btn-danger-ghost" type="button" hidden>Delete</button>
          <span class="spacer"></span>
          <button id="btn-cancel" class="btn btn-ghost" type="button">Cancel</button>
          <button id="btn-save" class="btn btn-primary" type="submit">Save</button>
        </footer>
      </form>
    </aside>
    <div id="drawer-scrim" class="scrim scrim-drawer" hidden></div>
  </div>

  <!-- Confirm dialog -->
  <dialog id="confirm" class="dialog">
    <form method="dialog">
      <h2 id="confirm-title">Are you sure?</h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" value="cancel">Cancel</button>
        <button id="confirm-ok" class="btn btn-primary" value="ok">Confirm</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="vaultcrypto.js"></script>
  <script src="app.js"></script>
</body>
</html>
